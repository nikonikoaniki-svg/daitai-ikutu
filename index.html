<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タコまるの「だいたいいくつ？」</title>
<style>
  :root{
    --bg:#fffaf3;
    --card:#ffffff;
    --ink:#263238;
    --accent:#f28c28;
    --accent2:#ffd59a;
    --line:#e7ddd1;
    --good:#2e7d32;
    --bad:#c62828;
    --blue:#2f6f9f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","UD デジタル 教科書体 N-R","Yu Gothic",sans-serif;min-height:100%}
  body{display:flex;justify-content:center;align-items:flex-start}
  button,input,select{font:inherit}
  button{touch-action:manipulation}
  .app{width:min(1100px,100%);padding:14px}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:12px
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(20px,3vw,32px)}
  .tako{width:54px;height:54px;flex:0 0 54px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{background:#fff4e3;border:1.5px solid #f0c890;border-radius:999px;padding:7px 11px;font-weight:700}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
  h1,h2,p{margin-top:0}
  h1{font-size:clamp(25px,4vw,38px);margin-bottom:8px}
  h2{font-size:clamp(22px,3vw,30px)}
  .center{text-align:center}
  .settings{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0
  }
  .setting{border:2px solid var(--line);border-radius:15px;padding:12px;background:#fffdf9}
  .setting label{display:block;font-weight:800;margin-bottom:8px}
  select,input[type=number]{
    width:100%;
    padding:12px 14px;
    border:2px solid #c9c1b8;
    border-radius:12px;
    background:#ffffff;
    color:#263238;
    -webkit-text-fill-color:#263238;
    font-size:20px;
  }
  select option{
    background:#ffffff;
    color:#263238;
  }
  .startbtn,.mainbtn,.subbtn{
    border:none;border-radius:14px;padding:14px 22px;font-weight:800;cursor:pointer
  }
  .startbtn,.mainbtn{background:var(--accent);color:white;font-size:22px;box-shadow:0 3px 0 #b96210}
  .subbtn{background:#f4eee7;color:var(--ink);font-size:18px}
  .mainbtn:active,.startbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b96210}
  .gamearea{
    height:min(58vh,520px);min-height:340px;position:relative;
    background:#fff;border:3px solid #d8cfc5;border-radius:20px;overflow:hidden;
  }
  .dot{
    position:absolute;width:18px;height:18px;border-radius:50%;background:#202020;
    transform:translate(-50%,-50%);
  }
  .cover{
    position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(30px,5vw,54px);z-index:5
  }
  .hidden{display:none!important}
  .questionbox{margin-top:14px;text-align:center}
  .question{font-size:clamp(22px,3.4vw,34px);font-weight:900;margin-bottom:10px}
  .answerrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .answerrow input{width:150px;text-align:center;font-size:30px;font-weight:800}
  .feedback{font-size:clamp(28px,5vw,48px);font-weight:900;margin:8px 0 10px}
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .exact{font-size:26px;font-weight:800;margin-bottom:10px}
  .organized{
    display:flex;flex-direction:column;gap:8px;align-items:flex-start;
    margin:12px auto 8px;width:max-content;max-width:900px;min-height:140px
  }
  .row10{display:flex;gap:6px;justify-content:flex-start}
  .odot{width:18px;height:18px;border-radius:50%;background:#202020}
  .groupwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .groupLabel{font-size:15px;color:#666;font-weight:700}
  .nextbox{
    border:2px dashed #efb165;border-radius:16px;padding:14px;margin-top:14px;background:#fffaf2
  }
  .small{font-size:15px;color:#5f6368}
  .resultgrid{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0
  }
  .resultcard{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:white}
  .resultcard b{display:block;font-size:28px;margin-top:4px}
  .history{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
  .history th,.history td{border-bottom:1px solid #ddd;padding:8px;text-align:center}
  .legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .legend span{padding:6px 9px;border-radius:999px;background:#f8f4ef}
  @media (max-width:760px){
    .settings,.resultgrid{grid-template-columns:1fr 1fr}
    .gamearea{min-height:320px;height:50vh}
    .dot,.odot{width:16px;height:16px}
  }
  @media (max-width:500px){
    .settings,.resultgrid{grid-template-columns:1fr}
    .stats{display:none}
    .app{padding:8px}
    .panel{padding:12px}
    .gamearea{height:46vh;min-height:300px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <svg class="tako" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="42" rx="30" ry="28" fill="#f28c28"/>
        <circle cx="40" cy="38" r="4" fill="#fff"/><circle cx="60" cy="38" r="4" fill="#fff"/>
        <circle cx="40" cy="38" r="2" fill="#263238"/><circle cx="60" cy="38" r="2" fill="#263238"/>
        <path d="M43 51 Q50 57 57 51" fill="none" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 58 Q13 76 27 80 Q35 81 37 68" fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round"/>
        <path d="M39 64 Q32 84 47 85 Q53 84 53 70" fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round"/>
        <path d="M61 64 Q68 84 53 85 Q47 84 47 70" fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round"/>
        <path d="M76 58 Q87 76 73 80 Q65 81 63 68" fill="none" stroke="#f28c28" stroke-width="9" stroke-linecap="round"/>
      </svg>
      <div>タコまるの「だいたいいくつ？」</div>
    </div>
    <div class="stats">
      <div class="pill">もんだい <span id="qNow">0</span>/<span id="qTotal">10</span></div>
      <div class="pill">ぴったり <span id="perfectCount">0</span></div>
    </div>
  </div>

  <section id="startScreen" class="panel center">
    <h1>だいたい、いくつ？</h1>
    <p>●をパッと見て、だいたい何こあるか予想しよう。</p>
    <div class="settings">
      <div class="setting">
        <label for="rangeSel">出る数</label>
        <select id="rangeSel">
          <option value="10,30">10〜30こ</option>
          <option value="20,50" selected>20〜50こ</option>
          <option value="30,70">30〜70こ</option>
          <option value="50,100">50〜100こ</option>
          <option value="10,100">10〜100こ</option>
        </select>
      </div>
      <div class="setting">
        <label for="timeSel">見る時間</label>
        <select id="timeSel">
          <option value="700">0.7秒</option>
          <option value="1000" selected>1秒</option>
          <option value="1500">1.5秒</option>
          <option value="2000">2秒</option>
          <option value="3000">3秒</option>
        </select>
      </div>
      <div class="setting">
        <label for="countSel">問題数</label>
        <select id="countSel">
          <option value="5">5問</option>
          <option value="10" selected>10問</option>
          <option value="15">15問</option>
          <option value="20">20問</option>
        </select>
      </div>
    </div>
    <div class="legend">
      <span>ぴったり：差0</span>
      <span>おしい：差1〜3</span>
      <span>もう少し：差4〜6</span>
      <span>多すぎ／少なすぎ：差7以上</span>
    </div>
    <p class="small">答え合わせのあと、「あと何こで次の何十？」にも挑戦します。</p>
    <button id="startBtn" class="startbtn">スタート</button>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="gamearea" id="gameArea">
      <div id="countdown" class="cover hidden">3</div>
      <div id="mask" class="cover hidden">だいたい、いくつ？</div>
    </div>

    <div id="guessBox" class="questionbox hidden">
      <div class="question">だいたい、何こあった？</div>
      <div class="answerrow">
        <input id="guessInput" type="number" min="0" max="999" inputmode="numeric" aria-label="予想した数">
        <button id="guessBtn" class="mainbtn">こたえる</button>
      </div>
    </div>

    <div id="feedbackBox" class="panel hidden" style="margin-top:12px">
      <div class="center">
        <div id="feedbackText" class="feedback"></div>
        <div id="exactText" class="exact"></div>
      </div>
      <div id="organized" class="organized"></div>
      <div id="nextTensBox" class="nextbox center">
        <div id="nextTensQ" class="question"></div>
        <div class="answerrow">
          <input id="nextTensInput" type="number" min="0" max="10" inputmode="numeric" aria-label="あと何個">
          <button id="nextTensBtn" class="mainbtn">こたえる</button>
        </div>
        <div id="nextTensFeedback" class="exact" style="margin-top:10px"></div>
      </div>
      <div class="center" style="margin-top:14px">
        <button id="nextBtn" class="mainbtn hidden">つぎのもんだい</button>
      </div>
    </div>
  </section>

  <section id="resultScreen" class="panel hidden">
    <div class="center">
      <h2>けっか</h2>
      <p id="resultComment"></p>
    </div>
    <div class="resultgrid">
      <div class="resultcard">ぴったり<b id="rPerfect">0</b></div>
      <div class="resultcard">平均のずれ<b id="rAvgErr">0</b></div>
      <div class="resultcard">多めに予想<b id="rHigh">0</b></div>
      <div class="resultcard">少なめに予想<b id="rLow">0</b></div>
    </div>
    <div style="overflow:auto">
      <table class="history">
        <thead><tr><th>問</th><th>本当の数</th><th>予想</th><th>ずれ</th><th>判定</th><th>次の何十まで</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
    <div class="center" style="margin-top:18px">
      <button id="restartBtn" class="startbtn">もういちど</button>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    total:10, now:0, min:20, max:50, showMs:1000,
    actual:0, guess:null, records:[], perfect:0, lock:false
  };

  const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;

  function setScreen(name){
    $("startScreen").classList.toggle("hidden", name!=="start");
    $("gameScreen").classList.toggle("hidden", name!=="game");
    $("resultScreen").classList.toggle("hidden", name!=="result");
  }

  function clearDots(){
    [...$("gameArea").querySelectorAll(".dot")].forEach(el=>el.remove());
  }

  function generatePoints(n){
    clearDots();
    const area = $("gameArea");
    const rect = area.getBoundingClientRect();
    const W = Math.max(rect.width, 320);
    const H = Math.max(rect.height, 300);
    const margin = 24;
    const minDist = n > 75 ? 18 : n > 50 ? 21 : 24;
    const pts = [];
    let attempts = 0;

    while(pts.length < n && attempts < n*250){
      attempts++;
      const x = rand(margin, Math.max(margin+1, Math.floor(W-margin)));
      const y = rand(margin, Math.max(margin+1, Math.floor(H-margin)));
      let ok = true;
      for(const p of pts){
        const dx=x-p.x, dy=y-p.y;
        if(dx*dx+dy*dy < minDist*minDist){ ok=false; break; }
      }
      if(ok) pts.push({x,y});
    }

    // dense fallback
    while(pts.length<n){
      pts.push({
        x: rand(margin, Math.max(margin+1, Math.floor(W-margin))),
        y: rand(margin, Math.max(margin+1, Math.floor(H-margin)))
      });
    }

    pts.forEach(p=>{
      const d=document.createElement("div");
      d.className="dot";
      d.style.left=p.x+"px";
      d.style.top=p.y+"px";
      area.appendChild(d);
    });
  }

  async function countdown(){
    const c=$("countdown");
    c.classList.remove("hidden");
    for(const t of ["3","2","1"]){
      c.textContent=t;
      await new Promise(r=>setTimeout(r,450));
    }
    c.classList.add("hidden");
  }

  async function newQuestion(){
    state.lock=false;
    state.now++;
    $("qNow").textContent=state.now;
    $("qTotal").textContent=state.total;
    $("perfectCount").textContent=state.perfect;
    $("guessBox").classList.add("hidden");
    $("feedbackBox").classList.add("hidden");
    $("mask").classList.add("hidden");
    $("nextBtn").classList.add("hidden");
    $("nextTensFeedback").textContent="";
    $("guessInput").value="";
    $("nextTensInput").value="";
    state.actual=rand(state.min,state.max);

    await countdown();
    generatePoints(state.actual);

    await new Promise(r=>setTimeout(r,state.showMs));
    clearDots();
    $("mask").classList.remove("hidden");
    $("guessBox").classList.remove("hidden");
    setTimeout(()=>$("guessInput").focus(),50);
  }

  function classify(diff){
    const ad=Math.abs(diff);
    if(ad===0) return {label:"ぴったり！", cls:"good"};
    if(ad<=3) return {label:"おしい！", cls:"good"};
    if(ad<=6) return {label:"もう少し！", cls:""};
    return diff>0 ? {label:"多すぎ！", cls:"bad"} : {label:"少なすぎ！", cls:"bad"};
  }

  function renderOrganized(n){
    const box=$("organized");
    box.innerHTML="";
    const full=Math.floor(n/10), rem=n%10;
    for(let i=0;i<full;i++){
      const wrap=document.createElement("div");
      wrap.className="groupwrap";
      const row=document.createElement("div");
      row.className="row10";
      for(let j=0;j<10;j++){
        const d=document.createElement("div"); d.className="odot"; row.appendChild(d);
      }
      const lab=document.createElement("div");
      lab.className="groupLabel";
      lab.textContent=(i+1)*10;
      wrap.appendChild(row); wrap.appendChild(lab); box.appendChild(wrap);
    }
    if(rem){
      const wrap=document.createElement("div");
      wrap.className="groupwrap";
      const row=document.createElement("div"); row.className="row10";
      for(let j=0;j<rem;j++){
        const d=document.createElement("div"); d.className="odot"; row.appendChild(d);
      }
      const lab=document.createElement("div"); lab.className="groupLabel";
      lab.textContent=n;
      wrap.appendChild(row); wrap.appendChild(lab); box.appendChild(wrap);
    }
  }

  function submitGuess(){
    if(state.lock) return;
    const v=parseInt($("guessInput").value,10);
    if(Number.isNaN(v)) return;
    state.lock=true;
    state.guess=v;
    const diff=v-state.actual;
    const c=classify(diff);
    $("feedbackText").textContent=c.label;
    $("feedbackText").className="feedback "+c.cls;
    $("exactText").textContent=`ほんとうは ${state.actual}こ`;
    renderOrganized(state.actual);

    const nextTen=Math.ceil(state.actual/10)*10;
    const needed=nextTen-state.actual;
    // exact tens: ask next +10, to avoid "あと0"
    const target = needed===0 ? state.actual+10 : nextTen;
    const need2 = target-state.actual;
    $("nextTensQ").textContent=`あと何こで ${target}こ になりますか？`;
    $("nextTensBox").dataset.answer=need2;

    $("guessBox").classList.add("hidden");
    $("mask").classList.add("hidden");
    $("feedbackBox").classList.remove("hidden");
    state.currentRecord={
      q:state.now, actual:state.actual, guess:v, diff:diff,
      judge:c.label, nextTarget:target, nextNeed:need2, nextCorrect:null
    };
    if(diff===0){state.perfect++; $("perfectCount").textContent=state.perfect;}
    setTimeout(()=>$("nextTensInput").focus(),50);
  }

  function submitNextTens(){
    const val=parseInt($("nextTensInput").value,10);
    if(Number.isNaN(val)) return;
    const ans=parseInt($("nextTensBox").dataset.answer,10);
    const ok=val===ans;
    $("nextTensFeedback").textContent = ok ? "せいかい！" : `こたえは ${ans}こ`;
    $("nextTensFeedback").style.color = ok ? "var(--good)" : "var(--bad)";
    state.currentRecord.nextCorrect=ok;
    state.records.push(state.currentRecord);
    $("nextTensBtn").disabled=true;
    $("nextTensInput").disabled=true;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = state.now>=state.total ? "けっかを見る" : "つぎのもんだい";
  }

  function next(){
    $("nextTensBtn").disabled=false;
    $("nextTensInput").disabled=false;
    if(state.now>=state.total) showResults();
    else newQuestion();
  }

  function showResults(){
    clearDots();
    setScreen("result");
    const recs=state.records;
    const avg=recs.length ? recs.reduce((a,r)=>a+Math.abs(r.diff),0)/recs.length : 0;
    const high=recs.filter(r=>r.diff>0).length;
    const low=recs.filter(r=>r.diff<0).length;
    $("rPerfect").textContent=state.perfect+"回";
    $("rAvgErr").textContent=avg.toFixed(1)+"こ";
    $("rHigh").textContent=high+"回";
    $("rLow").textContent=low+"回";
    let comment="";
    if(avg<=2) comment="数の大きさを、とてもよくつかめています。";
    else if(avg<=5) comment="かなり近く予想できています。10のまとまりを意識すると、もっと正確になります。";
    else comment="10こずつのまとまりを手がかりにして、もう一度チャレンジしてみよう。";
    if(high>=recs.length*0.7) comment += " 少し多めに予想することが多いようです。";
    if(low>=recs.length*0.7) comment += " 少し少なめに予想することが多いようです。";
    $("resultComment").textContent=comment;
    $("historyBody").innerHTML=recs.map(r=>`
      <tr>
        <td>${r.q}</td><td>${r.actual}</td><td>${r.guess}</td>
        <td>${r.diff>0?"+":""}${r.diff}</td><td>${r.judge}</td>
        <td>${r.nextTarget}まであと${r.nextNeed}：${r.nextCorrect?"○":"×"}</td>
      </tr>`).join("");
  }

  function start(){
    const [min,max]=$("rangeSel").value.split(",").map(Number);
    state.min=min; state.max=max;
    state.showMs=parseInt($("timeSel").value,10);
    state.total=parseInt($("countSel").value,10);
    state.now=0; state.records=[]; state.perfect=0;
    $("qNow").textContent=0; $("qTotal").textContent=state.total; $("perfectCount").textContent=0;
    setScreen("game");
    newQuestion();
  }

  $("startBtn").addEventListener("click",start);
  $("guessBtn").addEventListener("click",submitGuess);
  $("nextTensBtn").addEventListener("click",submitNextTens);
  $("nextBtn").addEventListener("click",next);
  $("restartBtn").addEventListener("click",()=>setScreen("start"));
  $("guessInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitGuess()});
  $("nextTensInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitNextTens()});

  // prevent double tap zoom on game controls
  let lastTouch=0;
  document.addEventListener("touchend",e=>{
    const now=Date.now();
    if(now-lastTouch<300) e.preventDefault();
    lastTouch=now;
  },{passive:false});
})();
</script>
</body>
</html>
